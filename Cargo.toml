[package]
name = "chess"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
description = "A legible chess engine built as a graph of blocks, with gates."
license = "MIT"
publish = false

[lib]
name = "chess"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "perft"
path = "src/bin/perft.rs"

[[bin]]
name = "render"
path = "src/bin/render.rs"

[[bin]]
name = "uci"
path = "src/bin/uci.rs"

[dependencies]

[profile.release]
debug = 1

[profile.wasm]
inherits = "release"
debug = 0
opt-level = "s"
lto = true
panic = "abort"
codegen-units = 1
